name: ZCode Tracker

# Detects new ZCode Windows x64 installer releases and uploads them as build
# artifacts, classified by version. See README.md (repo root) for details.

on:
  schedule:
    # Every day at 02:00 UTC (~10:00 Beijing time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download current version even if not new"
        required: false
        type: boolean
        default: false

# Prevent overlapping runs from stomping on the state file.
concurrency:
  group: zcode-tracker
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit updated state.json / catalog.json back

jobs:
  check-and-download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Detect & download ZCode release
        id: zcode
        working-directory: zcode-tracker
        # Exit codes: 0 done (downloaded), 2 no change, 3 check-only-new-available,
        # 1 hard error. Only code 1 should fail the step; 0/2/3 are all success.
        # Use `|| true` to bypass the runner's `set -e` so we can read $?.
        run: |
          python check_zcode.py ${{ inputs.force == true && '--force' || '' }} || rc=$? || rc=0
          case "${rc:-0}" in
            0|2|3) exit 0 ;;
            *) exit "${rc}" ;;
          esac

      # The script writes (via $GITHUB_OUTPUT):
      #   steps.zcode.outputs.changed  -> 'true' | 'false'
      #   steps.zcode.outputs.version  -> e.g. '3.4.2'
      #   steps.zcode.outputs.filename -> e.g. 'ZCode-3.4.2-win-x64.exe'
      #   steps.zcode.outputs.artifact_path -> 'downloads'

      - name: Upload installer as artifact
        if: steps.zcode.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-${{ steps.zcode.outputs.version }}-win-x64
          path: zcode-tracker/${{ steps.zcode.outputs.artifact_path }}/${{ steps.zcode.outputs.filename }}
          if-no-files-found: error
          retention-days: 90

      # Refresh the auto-managed README sections on EVERY run, so the
      # "Latest version" badge + history table always reflect the live site
      # and the catalog. Runs even when no new version was downloaded.
      - name: Update README (auto-managed sections)
        working-directory: zcode-tracker
        run: python update_readme.py

      # Commit state.json / catalog.json / README.md together. The action
      # only commits when there is an actual diff (no empty commits).
      - name: Commit updated state, catalog & README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: >-
            ${{ steps.zcode.outputs.changed == 'true'
              && format('chore(zcode): track ZCode {0}', steps.zcode.outputs.version)
              || 'chore(zcode): refresh README (no new version)' }}
          file_pattern: "zcode-tracker/state.json zcode-tracker/catalog.json README.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Summary (no change)
        if: steps.zcode.outputs.changed != 'true'
        run: |
          echo "### ZCode Tracker — no new version" >> $GITHUB_STEP_SUMMARY
          echo "Last seen: ${{ steps.zcode.outputs.version }}" >> $GITHUB_STEP_SUMMARY

      - name: Summary (new version)
        if: steps.zcode.outputs.changed == 'true'
        run: |
          echo "### ZCode Tracker — new version!" >> $GITHUB_STEP_SUMMARY
          echo "Downloaded & verified: **ZCode ${{ steps.zcode.outputs.version }}** (win-x64)" >> $GITHUB_STEP_SUMMARY
          echo "Uploaded as artifact: \`ZCode-${{ steps.zcode.outputs.version }}-win-x64\`" >> $GITHUB_STEP_SUMMARY
